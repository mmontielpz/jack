[package]
name = "jack-easy-pairing"
version = "0.1.0"
edition = "2021"
description = "Experimental isolated prototype for JACK Easy Pairing (EP-002)"

[dependencies]
base64 = "0.22"
data-encoding = "2.6"
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8", "zeroize"] }
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
spake2 = "0.4"
subtle = "2.6"
x509-parser = "0.16"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }
