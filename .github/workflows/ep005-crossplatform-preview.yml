name: EP-005 Cross-Platform Preview Build

on:
  push:
    branches: [feat/easy-pairing-ep-005, feat/easy-pairing-ep-005-win-stab]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Repo & Rust & Frontend checks
        run: |
          ./scripts/dev-check.sh
          cd easy-pairing && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
          cd ../desktop && npm ci && npm run lint && npm run build && npm test
          cd src-tauri && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
      - name: Build Linux AppImage & deb
        run: |
          cd desktop
          npx tauri build --bundles deb,appimage
          mkdir -p ../dist-artifacts
          cp src-tauri/target/release/bundle/appimage/*.AppImage ../dist-artifacts/
          cp src-tauri/target/release/bundle/deb/*.deb ../dist-artifacts/
          cd ../dist-artifacts && sha256sum * > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jack-desktop-linux-preview
          path: dist-artifacts/

  windows-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Windows Rust & Frontend tests
        shell: pwsh
        run: |
          cd easy-pairing
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cd ../desktop
          npm ci
          npm run lint
          npm run build
          npm test
          cd src-tauri
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Build Windows NSIS installer (unsigned experimental preview)
        shell: pwsh
        run: |
          cd desktop
          npx tauri build --bundles nsis
          New-Item -ItemType Directory -Force -Path ..\dist-artifacts | Out-Null
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe ..\dist-artifacts\
          Copy-Item src-tauri\target\release\jack-desktop.exe ..\dist-artifacts\
      - name: Windows isolated NSIS install, cold/warm profiling, and startup check
        shell: pwsh
        run: |
          $tmp = Join-Path $env:TEMP "jack-ep005-win-smoke"
          $inst = Join-Path $env:TEMP "jack-ep005-win-install"
          New-Item -ItemType Directory -Force -Path $tmp, $inst | Out-Null
          $env:JACK_HOME = $tmp
          $env:JACK_CONNECT_DRY_RUN = "1"

          $setupExe = (Get-ChildItem ".\dist-artifacts\*setup.exe" | Select-Object -First 1).FullName
          Write-Host "Installing NSIS: $setupExe -> $inst"
          $ip = Start-Process -FilePath $setupExe -ArgumentList "/S", "/D=$inst" -Wait -PassThru
          if ($ip.ExitCode -ne 0) { throw "NSIS silent install failed: $($ip.ExitCode)" }
          $exePath = Join-Path $inst "jack-desktop.exe"
          if (-not (Test-Path $exePath)) { $exePath = ".\dist-artifacts\jack-desktop.exe" }

          # Cold start measurement
          $sw1 = [System.Diagnostics.Stopwatch]::StartNew()
          $p1 = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 3
          $sw1.Stop()
          if ($p1.HasExited) { throw "Cold start exited prematurely with $($p1.ExitCode)" }
          $proc1 = Get-Process -Id $p1.Id
          Write-Host ("WINDOWS_COLD_START_ALIVE_MS={0} MEM_MB={1:N1} CPU_S={2:N2}" -f $sw1.ElapsedMilliseconds, ($proc1.WorkingSet64 / 1MB), $proc1.CPU)
          Stop-Process -Id $p1.Id -Force
          Start-Sleep -Seconds 1

          # Warm start measurement
          $sw2 = [System.Diagnostics.Stopwatch]::StartNew()
          $p2 = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 3
          $sw2.Stop()
          if ($p2.HasExited) { throw "Warm start exited prematurely with $($p2.ExitCode)" }
          $proc2 = Get-Process -Id $p2.Id
          Write-Host ("WINDOWS_WARM_START_ALIVE_MS={0} MEM_MB={1:N1} CPU_S={2:N2}" -f $sw2.ElapsedMilliseconds, ($proc2.WorkingSet64 / 1MB), $proc2.CPU)
          Stop-Process -Id $p2.Id -Force

          $uninst = Join-Path $inst "uninstall.exe"
          if (Test-Path $uninst) {
            Start-Process -FilePath $uninst -ArgumentList "/S" -Wait | Out-Null
          }
          Remove-Item -Recurse -Force $tmp, $inst -ErrorAction SilentlyContinue
      - name: Generate Windows SHA-256 checksums
        shell: pwsh
        run: |
          cd dist-artifacts
          Get-FileHash *.exe -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jack-desktop-windows-preview
          path: dist-artifacts/
