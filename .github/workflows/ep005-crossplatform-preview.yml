name: EP-005 Cross-Platform Preview Build

on:
  push:
    branches: [feat/easy-pairing-ep-005, feat/easy-pairing-ep-005-win-stab, "candidate/**"]
  pull_request:
    paths:
      - "desktop/**"
      - "easy-pairing/**"
      - ".github/workflows/ep005-crossplatform-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            easy-pairing/target/
            desktop/src-tauri/target/
          key: linux-2404-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            linux-2404-cargo-
      - name: Install Ubuntu 24.04 Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - name: Repo & Rust & Frontend checks (Ubuntu 24.04)
        run: |
          ./scripts/dev-check.sh
          cd easy-pairing && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
          cd ../desktop && npm ci && npm run lint && npm run build && npm test -- --run
          cd src-tauri && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
      - name: Build Linux AppImage & deb on Ubuntu 24.04 and run Xvfb smoke
        run: |
          set -euo pipefail
          cd desktop
          npx tauri build --bundles deb,appimage
          mkdir -p ../dist-artifacts
          cp src-tauri/target/release/bundle/appimage/*.AppImage ../dist-artifacts/
          cp src-tauri/target/release/bundle/deb/*.deb ../dist-artifacts/
          cd ../dist-artifacts

          APPIMAGE="$(ls -1 *.AppImage | head -n 1)"
          chmod +x "$APPIMAGE"
          TMP_HOME="$(mktemp -d)"
          mkdir -p "$TMP_HOME/.config/jack"
          set +e
          HOME="$TMP_HOME" JACK_HOME="$TMP_HOME/.config/jack" APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "./$APPIMAGE" >/tmp/linux-2404-smoke.log 2>&1 &
          PID=$!
          sleep 3
          if kill -0 "$PID" 2>/dev/null; then
            echo "UBUNTU_2404_APPIMAGE_ALIVE_3S=true"
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            wait "$PID"
            echo "UBUNTU_2404_APPIMAGE_EXIT=$?"
          fi
          set -e
          rm -rf "$TMP_HOME"

          {
            echo "COMMIT_SHA=${{ github.sha }}"
            echo "BUILD_OS=$(. /etc/os-release && echo "$PRETTY_NAME")"
            echo "GLIBC=$(ldd --version | head -n 1)"
            echo "RUSTC=$(rustc --version)"
            echo "NODE=$(node --version)"
          } > PROVENANCE-linux.txt
          sha256sum *.AppImage *.deb PROVENANCE-linux.txt > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jack-desktop-linux-preview
          path: dist-artifacts/

  ubuntu-26-04-verify:
    needs: linux-preview
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jack-desktop-linux-preview
          path: dist-artifacts/
      - name: Verify Ubuntu 24.04-built AppImage & deb on Ubuntu 26.04 LTS
        run: |
          set -euo pipefail
          cat /etc/os-release
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 xvfb file dpkg-dev
          cd dist-artifacts
          sha256sum -c SHA256SUMS-linux.txt

          DEB_FILE="$(ls -1 *.deb | head -n 1)"
          dpkg-deb -I "$DEB_FILE"

          APPIMAGE="$(ls -1 *.AppImage | head -n 1)"
          chmod +x "$APPIMAGE"
          file "$APPIMAGE"
          TMP_HOME="$(mktemp -d)"
          mkdir -p "$TMP_HOME/.config/jack"
          set +e
          HOME="$TMP_HOME" JACK_HOME="$TMP_HOME/.config/jack" APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "./$APPIMAGE" >/tmp/linux-2604-smoke.log 2>&1 &
          PID=$!
          sleep 3
          if kill -0 "$PID" 2>/dev/null; then
            echo "UBUNTU_2604_APPIMAGE_ALIVE_3S=true"
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            wait "$PID"
            RC=$?
            cat /tmp/linux-2604-smoke.log || true
            echo "UBUNTU_2604_APPIMAGE_EXIT=$RC"
            exit "$RC"
          fi
          set -e
          rm -rf "$TMP_HOME"

  windows-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            easy-pairing/target/
            desktop/src-tauri/target/
          key: windows-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            windows-cargo-
      - name: Windows Rust & Frontend tests
        shell: pwsh
        run: |
          cd easy-pairing
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cd ../desktop
          npm ci
          npm run lint
          npm run build
          npm test -- --run
          cd src-tauri
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Build Windows NSIS installer (unsigned experimental preview)
        shell: pwsh
        run: |
          cd desktop
          npx tauri build --bundles nsis
          New-Item -ItemType Directory -Force -Path ..\dist-artifacts | Out-Null
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe ..\dist-artifacts\
          Copy-Item src-tauri\target\release\jack-desktop.exe ..\dist-artifacts\
      - name: Windows isolated NSIS install, cold/warm profiling, and startup check
        shell: pwsh
        run: |
          $tmp = Join-Path $env:TEMP "jack-ep005-win-smoke"
          $inst = Join-Path $env:TEMP "jack-ep005-win-install"
          New-Item -ItemType Directory -Force -Path $tmp, $inst | Out-Null
          $env:JACK_HOME = $tmp
          $env:JACK_CONNECT_DRY_RUN = "1"

          $setupExe = (Get-ChildItem ".\dist-artifacts\*setup.exe" | Select-Object -First 1).FullName
          Write-Host "Installing NSIS: $setupExe -> $inst"
          $ip = Start-Process -FilePath $setupExe -ArgumentList "/S", "/D=$inst" -Wait -PassThru
          if ($ip.ExitCode -ne 0) { throw "NSIS silent install failed: $($ip.ExitCode)" }
          $exePath = Join-Path $inst "jack-desktop.exe"
          if (-not (Test-Path $exePath)) { $exePath = ".\dist-artifacts\jack-desktop.exe" }

          # Cold start measurement
          $sw1 = [System.Diagnostics.Stopwatch]::StartNew()
          $p1 = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 3
          $sw1.Stop()
          if ($p1.HasExited) { throw "Cold start exited prematurely with $($p1.ExitCode)" }
          $proc1 = Get-Process -Id $p1.Id
          Write-Host ("WINDOWS_COLD_START_ALIVE_MS={0} MEM_MB={1:N1} CPU_S={2:N2}" -f $sw1.ElapsedMilliseconds, ($proc1.WorkingSet64 / 1MB), $proc1.CPU)
          Stop-Process -Id $p1.Id -Force
          Start-Sleep -Seconds 1

          # Warm start measurement
          $sw2 = [System.Diagnostics.Stopwatch]::StartNew()
          $p2 = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 3
          $sw2.Stop()
          if ($p2.HasExited) { throw "Warm start exited prematurely with $($p2.ExitCode)" }
          $proc2 = Get-Process -Id $p2.Id
          Write-Host ("WINDOWS_WARM_START_ALIVE_MS={0} MEM_MB={1:N1} CPU_S={2:N2}" -f $sw2.ElapsedMilliseconds, ($proc2.WorkingSet64 / 1MB), $proc2.CPU)
          Stop-Process -Id $p2.Id -Force

          $uninst = Join-Path $inst "uninstall.exe"
          if (Test-Path $uninst) {
            Start-Process -FilePath $uninst -ArgumentList "/S" -Wait | Out-Null
          }
          Remove-Item -Recurse -Force $tmp, $inst -ErrorAction SilentlyContinue
      - name: Generate Windows SHA-256 checksums & provenance
        shell: pwsh
        run: |
          cd dist-artifacts
          "COMMIT_SHA=${{ github.sha }}`nOS=$([System.Environment]::OSVersion.VersionString)`nRUSTC=$(rustc --version)`nNODE=$(node --version)" | Set-Content PROVENANCE-windows.txt
          Get-FileHash *.exe -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jack-desktop-windows-preview
          path: dist-artifacts/
