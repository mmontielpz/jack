name: EP-005 macOS Preview Build

on:
  pull_request:
    paths:
      - "desktop/**"
      - "easy-pairing/**"
      - ".github/workflows/macos-preview.yml"
  workflow_dispatch:
    inputs:
      include_x64:
        description: "Also build Intel (x86_64-apple-darwin) DMG"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos-arm64-preview:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            easy-pairing/target/
            desktop/src-tauri/target/
          key: macos-cargo-aarch64-apple-darwin-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            macos-cargo-aarch64-apple-darwin-

      - name: Rust & Frontend checks
        run: |
          cd easy-pairing
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cd ../desktop
          npm ci
          npm run lint
          npm run build
          npm test -- --run
          cd src-tauri
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build, ad-hoc bundle-sign, and package macOS .app and .dmg (aarch64-apple-darwin)
        run: |
          set -euo pipefail
          cd desktop
          npx tauri build --target aarch64-apple-darwin --bundles app
          APP_BUNDLE="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/JACK Desktop.app"
          test -d "$APP_BUNDLE"
          codesign --force --deep --sign - "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=4 "$APP_BUNDLE"

          STAGING="$(mktemp -d)"
          trap 'rm -rf "$STAGING"' EXIT
          cp -R "$APP_BUNDLE" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          mkdir -p ../dist-artifacts
          DMG_NAME="JACK Desktop_0.1.0_arm64.dmg"
          hdiutil create -volname "JACK Desktop" -srcfolder "$STAGING" -ov -format UDZO "../dist-artifacts/$DMG_NAME"

      - name: Mount DMG, inspect bundle, verify arch/codesign, and run native smoke
        run: |
          set -euo pipefail
          DMG_PATH="$(find dist-artifacts -maxdepth 1 -name '*.dmg' | head -n 1)"
          test -s "$DMG_PATH"
          MOUNT_DIR="$(mktemp -d)"
          TMP_HOME="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT_DIR" -force >/dev/null 2>&1 || true
            rm -rf "$MOUNT_DIR" "$TMP_HOME"
          }
          trap cleanup EXIT

          hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_DIR" -nobrowse -readonly
          APP_PATH="$(find "$MOUNT_DIR" -maxdepth 1 -name '*.app' | head -n 1)"
          test -d "$APP_PATH"
          BIN_PATH="$APP_PATH/Contents/MacOS/jack-desktop"
          test -x "$BIN_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          test -f "$APP_PATH/Contents/Resources/icon.icns"
          test -f "$APP_PATH/Contents/_CodeSignature/CodeResources"

          ARCH_INFO="$(lipo -archs "$BIN_PATH")"
          FILE_INFO="$(file "$BIN_PATH")"
          echo "ARCH_INFO=$ARCH_INFO"
          echo "FILE_INFO=$FILE_INFO"
          echo "$ARCH_INFO" | grep -q "arm64"

          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          CODESIGN_OUT="$(codesign -dv --verbose=4 "$APP_PATH" 2>&1 || true)"
          echo "$CODESIGN_OUT"
          SPCTL_OUT="$(spctl --assess --type execute --verbose=4 "$APP_PATH" 2>&1 || true)"
          echo "$SPCTL_OUT"

          GUI_RUNTIME="NOT_TESTED"
          mkdir -p "$TMP_HOME/.config/jack"
          set +e
          HOME="$TMP_HOME" JACK_HOME="$TMP_HOME/.config/jack" "$BIN_PATH" >/tmp/jack-macos-smoke.log 2>&1 &
          APP_PID=$!
          sleep 3
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "MACOS_BIN_ALIVE_3S=true"
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          else
            wait "$APP_PID"
            RC=$?
            echo "MACOS_BIN_EXITED_EARLY=$RC"
          fi
          set -e

          {
            echo "COMMIT_SHA=${{ github.sha }}"
            echo "GITHUB_REF=${{ github.ref_name }}"
            echo "TARGET=aarch64-apple-darwin"
            echo "RUNNER_OS=$(sw_vers -productName) $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
            echo "RUNNER_ARCH=$(uname -m)"
            echo "RUSTC=$(rustc --version)"
            echo "NODE=$(node --version)"
            echo "XCODE=$(xcodebuild -version | tr '\n' ' ')"
            echo "BINARY_ARCH=$ARCH_INFO"
            echo "MACOS_GUI_RUNTIME=$GUI_RUNTIME"
            echo "--- CODESIGN ---"
            echo "$CODESIGN_OUT"
            echo "--- SPCTL ---"
            echo "$SPCTL_OUT"
          } > "dist-artifacts/PROVENANCE-macos-arm64.txt"

      - name: Generate macOS SHA-256 checksums
        run: |
          cd dist-artifacts
          shasum -a 256 *.dmg > "SHA256SUMS-macos-arm64.txt"
          cat "SHA256SUMS-macos-arm64.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: jack-desktop-macos-arm64-preview
          path: dist-artifacts/

  macos-x64-preview:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.include_x64 == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
          components: rustfmt, clippy
      - name: Build, ad-hoc bundle-sign, and package macOS Intel .dmg (x86_64-apple-darwin)
        run: |
          set -euo pipefail
          cd desktop
          npm ci
          npx tauri build --target x86_64-apple-darwin --bundles app
          APP_BUNDLE="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/JACK Desktop.app"
          codesign --force --deep --sign - "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=4 "$APP_BUNDLE"
          STAGING="$(mktemp -d)"
          trap 'rm -rf "$STAGING"' EXIT
          cp -R "$APP_BUNDLE" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          mkdir -p ../dist-artifacts
          hdiutil create -volname "JACK Desktop" -srcfolder "$STAGING" -ov -format UDZO "../dist-artifacts/JACK Desktop_0.1.0_x86_64.dmg"
          cd ../dist-artifacts
          shasum -a 256 *.dmg > "SHA256SUMS-macos-x64.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: jack-desktop-macos-x64-preview
          path: dist-artifacts/
