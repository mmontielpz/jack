name: CI

on:
  push:
    branches: [main, develop, "candidate/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record Ubuntu runner OS & kernel provenance
        run: |
          cat /etc/os-release
          uname -a
          bash --version | head -n 1
          python3 --version

      - name: Contributor validation
        run: ./scripts/dev-check.sh

      - name: JACK-VM-GRANT-001 & dogfood harness unit tests
        run: python3 -m unittest discover -s scripts/dogfood -p "test_*.py" -v

      - name: Isolated Ubuntu native smoke test (${{ matrix.os }})
        run: |
          T="$(mktemp -d)"
          trap 'rm -rf "$T"' EXIT
          mkdir -p "$T/home/.config/jack"
          chmod 700 "$T/home" "$T/home/.config" "$T/home/.config/jack"
          printf 'yes\n' | HOME="$T/home" ./scripts/setup-workstation.sh
          HOME="$T/home" "$T/home/.local/bin/jack" add ci-box --non-interactive --yes --user ciuser --host 127.0.0.1
          HOME="$T/home" "$T/home/.local/bin/jack" doctor --json | grep -q '"supported":true'
          printf 'yes\n' | HOME="$T/home" "$T/home/.local/bin/jack" uninstall
