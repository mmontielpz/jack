name: CI

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n bin/jack
          bash -n scripts/setup-macos.sh
          bash -n scripts/setup-workstation.sh

      - name: Executable check
        run: |
          test -x bin/jack
          test -x scripts/setup-macos.sh
          test -x scripts/setup-workstation.sh

      - name: Smoke test
        run: ./bin/jack --help

      - name: jack --status is deterministic on Linux (no Tailscale, no mutation)
        run: |
          set +e
          ./bin/jack --status
          status=$?
          set -e
          test "$status" -ne 0
          test ! -e "$HOME/.local/bin/jack"

      - name: jack rejects unknown arguments; jack mac fails fast without Tailscale
        run: |
          if ./bin/jack bogus; then exit 1; fi
          if ./bin/jack mac extra; then exit 1; fi
          set +e
          out="$(./bin/jack mac 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          echo "$out" | grep -q "Tailscale is not installed"

      - name: setup-workstation.sh rejects non-Arch systems without mutating the runner
        run: |
          set +e
          ./scripts/setup-workstation.sh
          status=$?
          set -e
          test "$status" -ne 0
          test ! -e "$HOME/.local/bin/jack"

      - name: setup-macos.sh rejects unsupported OS without mutating the runner
        run: |
          set +e
          ./scripts/setup-macos.sh
          status=$?
          set -e
          test "$status" -ne 0
          test ! -e "$HOME/.local/bin/jack"
          ! grep -qsF "added by jack setup-macos.sh" "$HOME/.zprofile" "$HOME/.bash_profile" "$HOME/.profile" 2>/dev/null
