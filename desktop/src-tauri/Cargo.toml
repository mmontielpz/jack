[package]
name = "jack-desktop"
version = "0.1.0"
description = "JACK Desktop V0.1"
authors = ["JACK Contributors"]
edition = "2021"

[lib]
name = "jack_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
